<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;background:#14181c;color:#e1ebe4;font:16px/1.5 system-ui,sans-serif}
html,body{margin:0;min-height:100%;background:#14181c;color:#e1ebe4}
body{padding:clamp(.35rem,1vw,1.25rem);box-sizing:border-box}
body>h1,body>h2,body>hr{display:none}
#gamemenu{font:600 0.92rem/1.5 system-ui;color:#c4ebd1;margin-bottom:1rem}
#gamemenu ul ul,#gamemenu li,#dlgform,body button,body input,body select{background:#222b30;color:#dcece2;border-color:#45544e}
#gamemenu li[role=separator]{background:transparent}
#gamemenu li>:hover:not(:disabled),#gamemenu li>.focus-within{background:#345044;color:#effff4}
#gamemenu :disabled{color:#a1aba6}
#statusbar{background:#202b27;color:#d7e6db!important;border:1px solid #425348;height:auto;min-height:1.5em}
#dlgform{box-sizing:border-box;border-radius:6px}
a{color:#a4e1bc}body>p{max-width:64ch;margin:1em auto}
#puzzlecanvas{border-radius:3px} #resizable{box-shadow:0 0 0 1px #35433f}

@media (pointer:coarse),(max-width:700px){
 html,body{margin:0;box-sizing:border-box;width:100%;overflow-x:hidden;background:#14181c;color:#dae7df;font:16px/1.45 system-ui}
 body>h1,body>h2,body>hr,#resizehandle{display:none}
 #resizable{max-width:100%;height:auto}#puzzlecanvas{touch-action:none;max-width:100%;height:auto}
 #gamemenu>ul{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;padding:4px;margin:0}
 #gamemenu>ul>li{float:none}#gamemenu button,#gamemenu [tabindex]{min-height:34px}
 #statusbar{color:#161a17}body a{color:#9ad9b4}body p{padding-inline:8px}
}
</style>
<script>
const puzzleOriginals=[];
const colourProbe=document.createElement('canvas').getContext('2d');
function boardColour(index,original){
 puzzleOriginals[index]=original;
 if(document.documentElement.classList.contains('original-palette'))return original;
 colourProbe.fillStyle=original;
 const hex=colourProbe.fillStyle;
 if(!/^#[0-9a-f]{6}$/i.test(hex))return original;
 const rgb=[1,3,5].map(n=>parseInt(hex.slice(n,n+2),16));
 if(Math.max(...rgb)-Math.min(...rgb)>28)return original;
 const level=Math.max(26,Math.round(232-rgb[0]*.89));
 return 'rgb('+level+','+Math.min(255,level+5)+','+Math.min(255,level+3)+')';
}
try{document.documentElement.classList.toggle('original-palette',localStorage.getItem('original-puzzle-palette')==='1');}catch{}
document.addEventListener('DOMContentLoaded',()=>{
 const canvas=document.querySelector('#puzzlecanvas');
 if(!canvas)return;
 const palette=document.createElement('button');
 palette.type='button';palette.textContent='Original board colours';
 const setPalette=original=>{document.documentElement.classList.toggle('original-palette',original);palette.setAttribute('aria-pressed',String(original));};
 let original=false;
 try{original=localStorage.getItem('original-puzzle-palette')==='1';}catch{}
 setPalette(original);
 palette.onclick=()=>{original=!original;setPalette(original);
 if(typeof colours!=='undefined' && typeof Module!=='undefined' && Module._rescale_puzzle){
  puzzleOriginals.forEach((colour,i)=>colours[i]=boardColour(i,colour));
  document.documentElement.style.setProperty('--puzzle-background',colours[0]);
  Module._rescale_puzzle();
 }
 try{localStorage.setItem('original-puzzle-palette',original?'1':'0');}catch{}};
 document.querySelector('#gamemenu').after(palette);
 let active=null, alternate=false;
 const button=document.createElement('button');
 button.type='button';button.textContent='Secondary move';button.setAttribute('aria-pressed','false');
 button.hidden=!matchMedia('(pointer:coarse)').matches;
 button.onclick=()=>{alternate=!alternate;button.setAttribute('aria-pressed',String(alternate));button.textContent=alternate?'Secondary move ✓':'Secondary move';};
 document.querySelector('#gamemenu').after(button);
 function mouse(type,e){canvas.dispatchEvent(new MouseEvent(type,{bubbles:true,cancelable:true,clientX:e.clientX,clientY:e.clientY,button:alternate?2:0,buttons:type==='mouseup'?0:alternate?2:1}));}
 for(const type of ['pointerdown','pointermove','pointerup','pointercancel']){
 canvas.addEventListener(type,e=>{
 if(e.pointerType!=='touch')return;
 if(type==='pointerdown'){if(active!==null)return;active=e.pointerId;canvas.setPointerCapture(active);canvas.focus({preventScroll:true});}
 if(e.pointerId!==active)return;
 e.preventDefault();e.stopImmediatePropagation();
 mouse(type==='pointerdown'?'mousedown':type==='pointermove'?'mousemove':'mouseup',e);
 if(type==='pointerup'||type==='pointercancel')active=null;
 },{capture:true,passive:false});}
});
</script>
